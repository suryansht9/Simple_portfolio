<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Expense Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      padding: 20px;
      max-width: 500px;
      margin: auto;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
      color: #2c3e50;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input[type="number"], select, input[type="text"] {
      flex: 1 1 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    @media (min-width: 500px) {
      input[type="number"], select, input[type="text"] {
        flex: 1 1 calc(33% - 10px);
      }
    }
    button {
      background: #27ae60;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      flex: 1 1 100%;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background: #219150;
    }
    .expenses-list {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-height: 300px;
      overflow-y: auto;
    }
    .expense-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding: 8px 0;
      align-items: center;
    }
    .expense-details {
      flex: 1;
    }
    .expense-amount {
      font-weight: bold;
      color: #e74c3c;
      margin-right: 15px;
      min-width: 70px;
      text-align: right;
    }
    .expense-category {
      font-style: italic;
      color: #7f8c8d;
    }
    .delete-btn {
      background: #e74c3c;
      border: none;
      color: white;
      padding: 5px 9px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.3s ease;
    }
    .delete-btn:hover {
      background: #c0392b;
    }
    .total {
      text-align: right;
      font-size: 1.2rem;
      margin-top: 15px;
      font-weight: bold;
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <h1>Expense Tracker</h1>

  <form id="expense-form">
    <input type="number" id="amount" placeholder="Amount ($)" min="0.01" step="0.01" required />
    <select id="category" required>
      <option value="" disabled selected>Category</option>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Bills">Bills</option>
      <option value="Others">Others</option>
    </select>
    <input type="text" id="description" placeholder="Description (optional)" maxlength="30" />
    <button type="submit">Add Expense</button>
  </form>

  <div class="expenses-list" id="expenses-list">
    <!-- Expenses will appear here -->
  </div>

  <div class="total" id="total">Total: $0.00</div>

  <script>
    const expenseForm = document.getElementById('expense-form');
    const expensesList = document.getElementById('expenses-list');
    const totalDisplay = document.getElementById('total');

    let expenses = [];

    function renderExpenses() {
      expensesList.innerHTML = '';
      expenses.forEach((expense, index) => {
        const expenseItem = document.createElement('div');
        expenseItem.classList.add('expense-item');

        const details = document.createElement('div');
        details.classList.add('expense-details');
        details.innerHTML = `
          <span class="expense-category">${expense.category}</span> - 
          <span>${expense.description || '-'}</span>
        `;

        const amount = document.createElement('div');
        amount.classList.add('expense-amount');
        amount.textContent = `$${expense.amount.toFixed(2)}`;

        const deleteBtn = document.createElement('button');
        deleteBtn.classList.add('delete-btn');
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => {
          deleteExpense(index);
        });

        expenseItem.appendChild(details);
        expenseItem.appendChild(amount);
        expenseItem.appendChild(deleteBtn);

        expensesList.appendChild(expenseItem);
      });

      updateTotal();
    }

    function updateTotal() {
      const total = expenses.reduce((sum, exp) => sum + exp.amount, 0);
      totalDisplay.textContent = `Total: $${total.toFixed(2)}`;
    }

    function deleteExpense(index) {
      expenses.splice(index, 1);
      renderExpenses();
    }

    expenseForm.addEventListener('submit', e => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value.trim();

      if (!amount || amount <= 0) {
        alert('Please enter a valid amount');
        return;
      }
      if (!category) {
        alert('Please select a category');
        return;
      }

      expenses.push({ amount, category, description });
      renderExpenses();

      // Clear form
      expenseForm.reset();
    });

    renderExpenses();
  </script>

</body>
</html>
